<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Results | Game Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="draft-app">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <div>
            <h1>🏆 DRAFT RESULTS 🏆</h1>
            <div class="sub">Final standings and scores</div>
        </div>
        <div class="badge" id="connectionStatus">✅ Complete</div>
    </div>

    <!-- Summary Stats -->
    <div id="summaryStats" class="summary-stats"></div>

    <!-- Results Container -->
    <div id="resultsContainer" class="results-container"></div>

    <!-- Actions -->
    <div class="results-actions">
        <button id="newDraftBtn" class="primary-btn">🎮 New Draft</button>
        <button id="homeBtn" class="secondary-btn">🏠 Home</button>
    </div>

    <footer>🎲 Thanks for playing!</footer>
</div>
<div id="toastMsg" class="toast-msg" style="opacity:0;">✨</div>

<script src="results.js"></script>
</body>
</html>
